<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Generated by tools/build.py from src/overlay.html. Edit that file, not this one. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <!-- Keeps the Dark Reader extension from recolouring the overlay. -->
    <meta name="darkreader-lock">
    <title>Valorant Ranked Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* The rank's colour unless the link picks one (see the script). */
            --accent: #b489c4;
            --accent-rgb: 180, 137, 196;
            --accent-light: color-mix(in srgb, var(--accent) 65%, white);
            /* Card look, set from the link. */
            --radius: 6px;
            --bg-alpha: 0.86;
        }

        html, body { background: transparent; }
        body {
            font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
            padding: 16px;
            overflow: hidden;
        }

        /* The card: the rank icon on the left, everything else beside it. */
        .card {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 18px;
            min-width: 480px;
            padding: 16px 24px 16px 16px;
            background: rgba(15, 25, 35, var(--bg-alpha));
            border: 1px solid rgba(255, 255, 255, calc(var(--bg-alpha) * 0.08));
            border-radius: var(--radius);
            user-select: none;
            color: #fff;
        }

        .rank-icon {
            width: 88px;
            height: 88px;
            flex: 0 0 auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
        }

        .info { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 28px;
        }

        .rank-text {
            font-weight: 800;
            font-size: 36px;
            line-height: 1.05;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .rank-text .place { color: var(--accent-light); margin-left: 10px; }

        .today {
            font-weight: 700;
            font-size: 22px;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: rgba(255, 255, 255, 0.55);
        }
        .pos  { color: #34d27b; }
        .neg  { color: #ff4655; }
        .zero { color: #ffffff; }

        /* Below Immortal: how far into the rank, and what's left to the next. */
        .bar {
            height: 10px;
            margin-top: 12px;
            border-radius: min(var(--radius), 99px);
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width 0.4s ease;
        }
        .bar-note {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 6px;
            align-items: baseline;
            font-weight: 600;
            font-size: 19px;
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.60);
        }
        .bar-note b { color: #fff; font-weight: 700; }
        .bar-note .have { color: var(--accent-light); font-weight: 800; font-size: 21px; }

        /* Immortal and Radiant: just the RR. */
        .rr-row {
            display: none;
            margin-top: 6px;
            font-weight: 800;
            font-size: 30px;
            white-space: nowrap;
            color: var(--accent-light);
        }
        html.top .bar, html.top .bar-note { display: none; }
        html.top .rr-row { display: block; }

        /* Today's wins and losses. */
        .wl {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.09);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .wl .w { color: #4ade80; }
        .wl .l { color: #ff6b76; }
        .wl .s { color: rgba(255, 255, 255, 0.45); }
        html.no-wl .wl { display: none; }

        /* Unrated, or a problem before any numbers arrived: just the words. */
        html.empty .bar, html.empty .bar-note, html.empty .rr-row, html.empty .wl, html.empty .today { display: none; }

        .error-text {
            max-width: 560px;
            margin-top: 6px;
            font-family: system-ui, sans-serif;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.4;
            color: rgba(245, 166, 35, 0.95);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* "Reset RR gain": only shows under the mouse, which in OBS means
           right-click > Interact, so viewers never see it. */
        .reset {
            position: absolute;
            top: 6px;
            right: 6px;
            padding: 3px 8px;
            font: 700 12px system-ui, sans-serif;
            color: #fff;
            background: rgba(255, 70, 85, 0.9);
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .card:hover .reset { opacity: 1; }
        html:not(.session) .reset, html.empty .reset { display: none; }

        /* ?outline=1: a ring in the rank's colour. */
        html.outline .card { border: 2px solid rgba(var(--accent-rgb), 0.9); }
        /* ?icon=0: no rank icon. */
        html.no-icon .rank-icon { display: none; }
        html.no-icon .card { padding-left: 24px; }
        /* A see-through card: a shadow under the text keeps it readable on gameplay. */
        html.clear .info { text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.9); }
        html.clear .bar { background: rgba(0, 0, 0, 0.45); }
    </style>
</head>
<body>
    <div class="card" id="card">
        <img class="rank-icon" id="rankIcon" alt="">
        <div class="info">
            <div class="top-row">
                <div class="rank-text" id="rankText">Loading</div>
                <div class="today" id="todayBox"><span id="todayLabel">Today</span>: <span id="todayVal" class="zero">+0 RR</span></div>
            </div>
            <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
            <div class="bar-note" id="barNote"></div>
            <div class="rr-row" id="rrRow"></div>
            <div class="wl" id="wl"></div>
        </div>
        <button class="reset" id="resetBtn" type="button" title="Start counting today's RR and wins from now">Reset</button>
    </div>
    <div class="error-text" id="errorText" hidden></div>

    <script src="engine.js?v=979a6d0d40"></script>
    <script>if (!window.RankedEngine) { var n = 0; try { n = +sessionStorage.getItem('vro-reloads') || 0; sessionStorage.setItem('vro-reloads', n + 1); } catch (e) {} setTimeout(function () { location.reload(); }, Math.min(60000, 5000 * Math.pow(2, n))); } else { try { sessionStorage.removeItem('vro-reloads'); } catch (e) {} }</script>
    <script>
        (function () {
            var q = new URLSearchParams(location.search), root = document.documentElement;
            function $(id) { return document.getElementById(id); }
            function setAccent(hex) {
                root.style.setProperty('--accent', hex);
                root.style.setProperty('--accent-rgb', parseInt(hex.substr(1, 2), 16) + ', '
                    + parseInt(hex.substr(3, 2), 16) + ', ' + parseInt(hex.substr(5, 2), 16));
            }

            var overlay = window.RankedOverlay = RankedEngine.startOverlay(location.search);
            var cfg = overlay.config;

            // Card look: round= corner rounding and bg= background opacity,
            // both 0 to 100; icon=0 hides the rank icon; outline=1 adds a ring.
            function pct(name) {
                var v = parseInt(q.get(name), 10);
                return isFinite(v) ? Math.max(0, Math.min(100, v)) : null;
            }
            var round = pct('round'), bg = pct('bg');
            if (round !== null) root.style.setProperty('--radius', (round * 0.4) + 'px');
            if (bg !== null) {
                root.style.setProperty('--bg-alpha', String(bg / 100));
                root.classList.toggle('clear', bg < 40);
            }
            root.classList.toggle('no-icon', q.get('icon') === '0');
            root.classList.toggle('outline', q.get('outline') === '1');
            root.classList.toggle('no-wl', !cfg.wl);
            root.classList.toggle('session', cfg.since === 'session');
            if (cfg.color) setAccent(cfg.color);

            var icon = $('rankIcon');
            icon.addEventListener('error', function () { icon.style.visibility = 'hidden'; });
            icon.addEventListener('load', function () { icon.style.visibility = ''; });

            function esc(s) {
                return String(s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            }
            function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

            function render() {
                var d = overlay.view();
                var err = $('errorText');
                err.textContent = d.error || '';
                err.hidden = !d.error;

                if (!d.ok) {
                    root.classList.add('empty');
                    root.classList.remove('top');
                    $('rankText').textContent = d.error === 'starting up' ? 'Loading' : 'No data';
                    icon.style.display = 'none';
                    return;
                }
                root.classList.toggle('empty', !d.tier);
                root.classList.toggle('top', d.top);
                if (!cfg.color && d.color) setAccent(d.color);

                icon.style.display = '';
                if (icon.getAttribute('src') !== d.icon) icon.setAttribute('src', d.icon);

                $('rankText').innerHTML = '<span class="name">' + esc(d.tier_name) + '</span>'
                    + (d.leaderboard ? '<span class="place">#' + d.leaderboard + '</span>' : '');

                if (!d.tier) {
                    // Unrated: how many placement games are left, if HenrikDev says.
                    var left = d.games_needed;
                    err.textContent = d.error || (left ? plural(left, 'more ranked game', 'more ranked games') + ' to get a rank' : '');
                    err.hidden = !err.textContent;
                    return;
                }

                $('todayLabel').textContent = d.window_label;
                var v = $('todayVal');
                v.textContent = (d.rr_change > 0 ? '+' : d.rr_change < 0 ? '−' : '+') + Math.abs(d.rr_change) + ' RR';
                v.className = d.rr_change > 0 ? 'pos' : d.rr_change < 0 ? 'neg' : 'zero';

                if (d.top) {
                    $('rrRow').textContent = d.rr.toLocaleString('en-US') + ' RR';
                } else {
                    $('barFill').style.width = d.progress + '%';
                    $('barNote').innerHTML = '<span class="have">' + d.rr + ' RR</span>'
                        + '<span><b>' + d.rr_to_next + ' RR</b> to ' + esc(d.next_name) + '</span>';
                }

                var wl = '<span class="w">' + plural(d.wins, 'Win', 'Wins') + '</span><span class="s">, </span>'
                    + '<span class="l">' + plural(d.losses, 'Loss', 'Losses') + '</span>';
                if (d.draws) wl += '<span class="s">, ' + plural(d.draws, 'Draw', 'Draws') + '</span>';
                $('wl').innerHTML = wl;
            }

            $('resetBtn').addEventListener('click', function () { overlay.resetSession(); });
            overlay.onUpdate(render);
            render();
        })();
    </script>
</body>
</html>
